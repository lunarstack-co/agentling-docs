[project]
name = "agentling-docs-examples"
version = "0"
description = "Runs every Python example on agentling.dev against Agentling."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "agentling==0.2.0",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
